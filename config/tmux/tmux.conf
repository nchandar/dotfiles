# --- optional: remove if you don't have this file ---
# source-file ~/.config/tmux/tmux.reset.conf

# Terminal / colors (Ghostty + truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi

set -g pane-active-border-style 'fg=magenta,bg=default'
set -g pane-border-style 'fg=brightblack,bg=default'

# Status bar + window titles
set -g status-interval 10
set -g status-style 'fg=white,bg=default'
set -g status-left-length 80
set -g status-right-length 120
set -g status-left '#[fg=cyan]󰙀 #S #[fg=brightblack]| #[fg=green]󰀵 #(whoami)@#H #[fg=brightblack]| #[fg=blue]󰉋 #{pane_current_path}'
set -g status-right '#[fg=yellow]󰁹 #(pmset -g batt | grep -Eo "[0-9]+%" | head -n1) #[fg=brightblack]| #[fg=magenta]󰥔 %Y-%m-%d %H:%M '
setw -g window-status-format ' #I:#W '
setw -g window-status-current-format '#[fg=black,bg=cyan] #I:#W #[default]'
set -g pane-border-status top
set -g pane-border-format '#[fg=brightblack]#{pane_index} #[fg=white]#{pane_current_command}'

# Notifications
setw -g monitor-activity on
set -g visual-activity on
set -g bell-action none
set -g visual-bell on
set -g visual-silence on

# Plugins (TPM required)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# Remove/replace these (they're user-specific)
# set -g @sessionx-custom-paths '/Users/omerxx/dotfiles'
# set -g @sessionx-x-path '~/dotfiles'

run '~/.tmux/plugins/tpm/tpm'
