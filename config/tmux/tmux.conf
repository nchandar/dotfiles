# --- optional: remove if you don't have this file ---
# source-file ~/.config/tmux/tmux.reset.conf

# Terminal / colors (Ghostty + truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi

# Catppuccin palette
set -g @catppuccin_flavour 'mocha'

set -g pane-active-border-style 'fg=#89b4fa,bg=default'
set -g pane-border-style 'fg=#585b70,bg=default'

# Status bar + window titles
set -g status-interval 10
set -g status-style 'fg=#cdd6f4,bg=#1e1e2e'
set -g status-left-length 80
set -g status-right-length 120
set -g status-left '#[fg=#1e1e2e,bg=#a6e3a1] 󰙀 #S #[fg=#a6e3a1,bg=#1e1e2e] #[fg=#1e1e2e,bg=#89dceb] 󰀵 #(whoami)@#H #[fg=#89dceb,bg=#1e1e2e] #[fg=#1e1e2e,bg=#89b4fa] 󰉋 #{pane_current_path} #[fg=#89b4fa,bg=#1e1e2e]'
set -g status-right '#[fg=#1e1e2e,bg=#f9e2af] 󰁹 #(pmset -g batt | grep -Eo \"[0-9]+%\" | head -n1) #[fg=#f9e2af,bg=#1e1e2e] #[fg=#1e1e2e,bg=#cba6f7] 󰥔 %Y-%m-%d %H:%M #[fg=#cba6f7,bg=#1e1e2e]'
setw -g window-status-format '#[fg=#cdd6f4,bg=#313244] #I:#W '
setw -g window-status-current-format '#[fg=#1e1e2e,bg=#89b4fa] #I:#W #[default]'
set -g pane-border-status top
set -g pane-border-format '#[fg=#6c7086]#{pane_index} #[fg=#cdd6f4]#{pane_current_command}'

# Notifications
setw -g monitor-activity on
set -g visual-activity on
set -g bell-action none
set -g visual-bell on
set -g visual-silence on

# Plugins (TPM required)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'omerxx/catppuccin-tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# Remove/replace these (they're user-specific)
# set -g @sessionx-custom-paths '/Users/omerxx/dotfiles'
# set -g @sessionx-x-path '~/dotfiles'

run '~/.tmux/plugins/tpm/tpm'
