# --- optional: remove if you don't have this file ---
# source-file ~/.config/tmux/tmux.reset.conf

# Terminal / colors (Ghostty + truecolor)
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*:Tc"

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1
set -g detach-on-destroy off
set -g escape-time 0
set -g history-limit 1000000
set -g renumber-windows on
set -g set-clipboard on
set -g status-position top
setw -g mode-keys vi

# Catppuccin (let the plugin own the status line)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_left_separator ""
set -g @catppuccin_window_right_separator ""
set -g @catppuccin_window_middle_separator "  "
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_default_fill "all"
set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_status_icon_enable "yes"

set -g @catppuccin_status_modules_left "session"
set -g @catppuccin_status_modules_right "application"
set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_right_separator ""
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_connect_separator "no"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_justify "left"

# Pane labels (disable for cleaner bar)
set -g @catppuccin_pane_status_enabled "no"

# Notifications
setw -g monitor-activity on
set -g visual-activity on
set -g bell-action none
set -g visual-bell on
set -g visual-silence on

# Plugins (TPM required)
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'omerxx/tmux-floax'

# Remove/replace these (they're user-specific)
# set -g @sessionx-custom-paths '/Users/omerxx/dotfiles'
# set -g @sessionx-x-path '~/dotfiles'

run '~/.tmux/plugins/tpm/tpm'
