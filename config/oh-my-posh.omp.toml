version = 4
final_space = true

[[blocks]]
type = "prompt"
alignment = "left"

[[blocks.segments]]
type = "path"
style = "diamond"
foreground = "#1e1e2e"
background = "#b4befe"
leading_diamond = ""
trailing_diamond = ""
template = " 󰉋 {{ .Path }} "

[blocks.segments.options]
style = "agnoster_short"
max_depth = 3
hide_root_location = true
folder_icon = ".."
folder_separator_icon = "/"

[[blocks.segments]]
type = "text"
style = "diamond"
foreground = "#1e1e2e"
background = "#a6e3a1"
foreground_templates = ["{{ if gt .Code 0 }}#1e1e2e{{ end }}"]
background_templates = ["{{ if gt .Code 0 }}#f38ba8{{ end }}"]
leading_diamond = ""
trailing_diamond = ""
template = " {{ if gt .Code 0 }}✗{{ else }}➜{{ end }} "

[[blocks]]
type = "rprompt"

[[blocks.segments]]
type = "git"
style = "diamond"
foreground = "#1e1e2e"
background = "#fab387"
leading_diamond = ""
trailing_diamond = ""
template = " {{ .HEAD }}{{ if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }} !{{ .Working.String }}{{ end }}{{ if .Staging.Changed }} +{{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }} ${{ .StashCount }}{{ end }} "

[blocks.segments.options]
fetch_status = true
fetch_upstream_icon = false
source = "cli"

[[blocks.segments]]
type = "status"
style = "diamond"
foreground = "#1e1e2e"
background = "#f38ba8"
leading_diamond = ""
trailing_diamond = ""
template = " ✗ {{ .String }} "

[[blocks.segments]]
type = "text"
style = "diamond"
foreground = "#1e1e2e"
background = "#94e2d5"
leading_diamond = ""
trailing_diamond = ""
template = "{{ if gt .Jobs 0 }} ✦ {{ .Jobs }} {{ end }}"

[[blocks.segments]]
type = "executiontime"
style = "diamond"
foreground = "#1e1e2e"
background = "#89b4fa"
leading_diamond = ""
trailing_diamond = ""
template = " ⏱ {{ .FormattedMs }} "

[blocks.segments.options]
threshold = 500
style = "austin"

[[blocks.segments]]
type = "time"
style = "diamond"
foreground = "#1e1e2e"
background = "#cba6f7"
leading_diamond = ""
trailing_diamond = ""
template = " 󰥔 {{ .CurrentDate | date .Format }} "

[blocks.segments.options]
time_format = "15:04"

[[blocks.segments]]
type = "battery"
style = "diamond"
foreground = "#1e1e2e"
background = "#a6e3a1"
background_templates = [
  "{{ if eq \"Charging\" .State.String }}#89dceb{{ end }}",
  "{{ if eq \"Discharging\" .State.String }}#f38ba8{{ end }}",
  "{{ if eq \"Full\" .State.String }}#a6e3a1{{ end }}"
]
leading_diamond = ""
trailing_diamond = ""
template = " {{ if not .Error }}{{ .Icon }}{{ .Percentage }}{{ end }} "

[blocks.segments.options]
charging_icon = "󰂄 "
discharging_icon = "󰂂 "
charged_icon = "󰁹 "
