# Voxtype configuration (macOS)
#
# Symlinked to ~/Library/Application Support/voxtype/config.toml by bootstrap.sh.
# Full reference: https://github.com/peteonrails/voxtype/blob/main/config.example.toml
# Most keys can also be set with `voxtype config set <key> <value>`.

# Daemon writes "idle" / "recording" / "transcribing" here; "auto" picks the
# default location. Required for `voxtype status` and `voxtype record toggle`.
state_file = "auto"

[hotkey]
# Hold to record, release to transcribe. FN (Globe key) is the macOS default.
key = "FN"
modifiers = []

[audio]
device = "default"
sample_rate = 16000
max_duration_secs = 60

[whisper]
# tiny / base / small / medium / large-v3 / large-v3-turbo (+ .en variants).
# `voxtype setup --download` fetches whatever is set here.
model = "base.en"
language = "en"
translate = false

[output]
# "type" simulates keystrokes at the cursor; falls back to clipboard on failure.
mode = "type"
fallback_to_clipboard = true
type_delay_ms = 0

[output.notification]
on_recording_start = false
on_recording_stop = false
on_transcription = true

[osd]
# On-screen display is a Linux/Wayland frontend; not shipped for macOS.
enabled = false
