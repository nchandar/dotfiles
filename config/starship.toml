add_newline = false
palette = "catppuccin_mocha"
command_timeout = 1000

# Left prompt: prompt char only
format = """$character"""

# Right prompt: all modules (including git) live here
right_format = """$directory$git_branch$git_status$status$jobs$cmd_duration$time$battery"""

[character]
vicmd_symbol = "[N] >>>"
success_symbol = '[➜](bold green)'
error_symbol = '[✗](bold red)'

[directory]
format = '[󰉋 $path]($style) '
style = 'fg=base bg=lavender'
truncation_length = 3
truncate_to_repo = true

[directory.substitutions]
'~/tests/starship-custom' = 'project'

[git_branch]
format = '[$branch]($style)'
style = 'fg=base bg=peach'

[git_status]
format = '[$all_status$ahead_behind$up_to_date]($style) '
style = 'fg=text bg=surface1'
conflicted = '[=](bold red)'
ahead = '[⇡${count}](bold sky)'
behind = '[⇣${count}](bold sky)'
diverged = '[⇕⇡${ahead_count}⇣${behind_count}](bold sky)'
up_to_date = '[✓](bold green)'
untracked = '[?](bold red)'
stashed = '[$](bold yellow)'
modified = '[!](bold red)'
staged = '[+](bold yellow)'
renamed = '[»](bold yellow)'
deleted = '[✘](bold red)'

[status]
disabled = false
format = '[$symbol$status]($style)'
symbol = '✗'
success_symbol = ''
style = 'fg=base bg=red'

[jobs]
symbol = '✦'
format = '[$symbol$number]($style)'
style = 'fg=base bg=teal'

[cmd_duration]
min_time = 500
format = '[⏱ $duration]($style)'
style = 'fg=base bg=blue'

[time]
disabled = false
time_format = '%H:%M'
format = '[󰥔 $time]($style) '
style = 'fg=base bg=mauve'

[battery]
format = '[ $percentage]($style) '
charging_symbol = '󰂄 '
discharging_symbol = '󰂂 '
full_symbol = '󰁹 '

[[battery.display]]
threshold = 100
style = 'fg=base bg=green'

[golang]
format = '[ ](bold cyan)'

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
