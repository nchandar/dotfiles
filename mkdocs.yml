site_name: Niranjan's Dotfiles
site_description: Dotfiles docs, setup guides, and keyboard shortcuts
site_url: https://nchandar.github.io/dotfiles/
repo_url: https://github.com/nchandar/dotfiles
repo_name: nchandar/dotfiles

theme:
  name: material
  font:
    text: Space Grotesk
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.tabs
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/header-home-link.js

nav:
  - Home: index.md
  - Keyboard Shortcuts: keyboard-shortcuts.md
  - Setup:
    - Overview: setup/index.md
    - Bootstrap: setup/bootstrap.md
    - Symlinks: setup/symlinks.md
  - Keybindings:
    - Overview: keybindings/index.md
    - AeroSpace: keybindings/aerospace.md
    - Hammerspoon: keybindings/hammerspoon.md
    - tmux: keybindings/tmux.md
  - Tools:
    - Overview: tools/index.md
    - Neovim: tools/nvim.md
    - Nushell: tools/nushell.md
    - Yazi: tools/yazi.md
    - Ghostty: tools/ghostty.md
    - Oh My Posh: tools/oh-my-posh.md
  - Troubleshooting: troubleshooting.md
